[project]
name = "nifi_scripts"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "asn1tools (>=0.167.0,<0.168.0)",
    "xmltodict (>=1.0.4,<1.1.0)"
]

[tool.poetry]
packages = [{include = "src"}]


[tool.poetry.group.dev.dependencies]
# `requires-python` above is ">=3.9" because the runtime images are Python 3.9
# (see deployment/eventPublisher/Dockerfile and deployment/kafka_speed_exporter/Dockerfile).
# pytest 9.x and bandit 1.9.x require >=3.10, so a single constraint cannot be resolved
# across the whole supported range. Declare a version per interpreter range instead, so
# `poetry install` works on 3.9 and on 3.10+ without weakening the runtime floor.
pytest = [
    { version = "^9.1.1", python = ">=3.10" },
    { version = "^8.4.2", python = "<3.10" },
]
pytest-cov = "^7.1.0"
ruff = "^0.16.1"
bandit = [
    { version = "^1.9.4", python = ">=3.10" },
    { version = "^1.8.6", python = "<3.10" },
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# Linting (ruff) and static analysis (bandit) for the NiFi scripts.
# See ../../../docs/Development.md for how to run these across all first-party Python.
[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The test fixture embeds a single-line ETSI DENM XML payload that must stay intact.
"**/tests/**" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests"]
